apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: track32-redis
  namespace: argocd
spec: 
  destination: 
    namespace: track32
    server: "https://kubernetes.default.svc"
  project: local
  source: 
    path: track32/redis
    repoURL: "https://github.com/mvankrieken/argocd-config.git"
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true